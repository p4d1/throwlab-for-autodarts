<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Schwarz-Gelbes App-Tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="2.5"/>

  <g transform="translate(128, 128)" filter="url(#goldGlow)">
    <!-- 3 Symmetrische Kamera-Arme (120° verteilt: 0° unten, 120°, 240°) als Mix aus neuem & altem Logo -->
    <g>
      <line x1="0" y1="36" x2="0" y2="96" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="36" x2="0" y2="96" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" transform="rotate(120)"/>
      <line x1="0" y1="36" x2="0" y2="96" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" transform="rotate(240)"/>
    </g>

    <!-- 3 Symmetrische V-Flügel vom neuen Autodarts-Logo in Gold/Amber -->
    <g fill="url(#goldMain)">
      <path d="M -56 82 L -17 41 Q 0 24 17 41 L 56 82 L 34 82 L 8 54 Q 0 46 -8 54 L -34 82 Z"/>
      <path d="M -56 82 L -17 41 Q 0 24 17 41 L 56 82 L 34 82 L 8 54 Q 0 46 -8 54 L -34 82 Z" transform="rotate(120)"/>
      <path d="M -56 82 L -17 41 Q 0 24 17 41 L 56 82 L 34 82 L 8 54 Q 0 46 -8 54 L -34 82 Z" transform="rotate(240)"/>
    </g>

    <!-- Klassische konzentrische Ziel-Ringe -->
    <circle cx="0" cy="0" r="33" fill="none" stroke="url(#goldSoft)" stroke-width="8.5"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#fde047" stroke-width="6"/>
  </g>
</svg>
